server:
  port: ${SERVER_PORT:8888}

spring:
  application:
    name: resource-booking
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/booking}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    # Must be at least 32 characters. ALWAYS override in any real deployment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  seed:
    enabled: ${SEED_ENABLED:true}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
